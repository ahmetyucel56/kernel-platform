# Alembic yapilandirmasi. Baglanti adresi BURADA DEGIL: migrations/env.py,
# uygulamayla ayni ayari (settings.database_url / DATABASE_URL) kullanir.
#
# Yeni sema degisikligi (models.py'yi degistirdikten sonra):
#   DATABASE_URL=sqlite:///./migrate_tmp.db alembic upgrade head
#   DATABASE_URL=sqlite:///./migrate_tmp.db alembic revision --autogenerate -m "aciklama"
# DIKKAT: backend/.env canli veritabanini gosterebilir; komutlari her zaman
# yerel bir DATABASE_URL ile calistir. Canliya uygulama acilista otomatik yapilir.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
