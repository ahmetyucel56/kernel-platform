# Render Blueprint — backend'i (FastAPI) ucretsiz web servisi olarak yayinlar.
# Render panelinde: New + > Blueprint > bu repo'yu sec. Asagidaki "sync: false"
# olan degiskenleri panelden elle gireceksin (Supabase baglantisi + frontend URL).
services:
  - type: web
    name: kernel-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: BRAND_NAME
        value: Kernel
      - key: AUTH_PROVIDER
        value: local
      - key: JWT_SECRET
        generateValue: true # Render otomatik guclu bir deger uretir
      - key: JWT_EXPIRES_MINUTES
        value: "10080"
      - key: AI_PROVIDER
        value: mock
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: SEED_ON_START
        value: "true" # demo hesaplarini ilk acilista olusturur
      # --- Asagidakileri Render panelinden ELLE gireceksin ---
      - key: DATABASE_URL
        sync: false # Supabase session pooler baglanti dizesi (asagida DEPLOY.md)
      - key: CORS_ORIGINS
        sync: false # Vercel frontend adresin, or: https://kernel.vercel.app
